[project]
name = "docflow-extraction-worker"
version = "0.2.0"
description = "Document text/OCR/AI extraction worker for DocFlow"
requires-python = ">=3.11"
dependencies = [
  "pymupdf",
  "pdfplumber",
  "pydantic>=2",
  "jsonschema>=4",
  "openai>=3.26.0,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["docflow_worker*"]
