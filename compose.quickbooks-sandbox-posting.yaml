    environment:
      AccountingPosting__QuickBooksOnline__Targets__0__CustomerId: "${DOCFLOW_CUSTOMER_ID:-11111111-1111-1111-1111-111111111111}"
      AccountingPosting__QuickBooksOnline__Targets__0__TargetKey: "${DOCFLOW_QBO_TARGET_KEY:-qbo-sandbox}"
      AccountingPosting__QuickBooksOnline__Targets__0__ApAccountId: "${DOCFLOW_QBO_AP_ACCOUNT_ID:?Set DOCFLOW_QBO_AP_ACCOUNT_ID after running reference discovery}"
      AccountingPosting__QuickBooksOnline__Targets__0__DefaultExpenseAccountId: "${DOCFLOW_QBO_DEFAULT_EXPENSE_ACCOUNT_ID:?Set DOCFLOW_QBO_DEFAULT_EXPENSE_ACCOUNT_ID after running reference discovery}"
      AccountingPosting__QuickBooksOnline__Targets__0__Vendors__0__SupplierName: "${DOCFLOW_QBO_VENDOR_NAME:?Set DOCFLOW_QBO_VENDOR_NAME}"
      AccountingPosting__QuickBooksOnline__Targets__0__Vendors__0__VendorId: "${DOCFLOW_QBO_VENDOR_ID:?Set DOCFLOW_QBO_VENDOR_ID from reference discovery}"
      AccountingPosting__QuickBooksOnline__Targets__0__TaxCodes__0__Rate: "${DOCFLOW_QBO_TAX_RATE:-20}"
      AccountingPosting__QuickBooksOnline__Targets__0__TaxCodes__0__TaxCodeId: "${DOCFLOW_QBO_TAX_CODE_ID:?Set DOCFLOW_QBO_TAX_CODE_ID from reference discovery}"
