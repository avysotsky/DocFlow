name: Automation E2E
# Final validation: 1.1.1.14 RestartRecovery

on:
  push:
    branches:
      - 'DocFlow/v_*'
    paths:
      - 'src/DocFlow.Api/**'
      - 'src/DocFlow.Application/**'
      - 'src/DocFlow.Domain/**'
      - 'src/DocFlow.Infrastructure/**'
      - 'src/DocFlow.Extraction.Worker/**'
      - '.github/scripts/generate_supplier_quotation_pdf.py'
      - '.github/scripts/generate_supplier_invoice_pdf.py'
      - '.github/scripts/verify_batch_idempotency.py'
      - '.github/scripts/verify_document_export.py'
      - '.github/scripts/verify_document_inbox.py'
      - '.github/scripts/verify_document_review.py'
      - '.github/scripts/verify_restart_recovery.sh'
      - '.github/scripts/webhook_receiver.py'
      - '.github/workflows/automation-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: docflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/DocFlow.Extraction.Worker/pyproject.toml

      - name: Install Python worker
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pip install -e ".[dev]"

      - name: Build .NET
        run: |
          dotnet restore DocFlow.sln
          dotnet build DocFlow.sln --configuration Release --no-restore

      - name: Apply database migrations
        env:
          ConnectionStrings__DocFlowDbContext: Host=127.0.0.1;Port=5432;Database=docflow;Username=postgres;Password=postgres
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.21
          ~/.dotnet/tools/dotnet-ef database update \
            --project src/DocFlow.Infrastructure/DocFlow.Infrastructure.csproj \
            --startup-project src/DocFlow.Api/DocFlow.Api.csproj

      - name: Generate synthetic supplier documents
        run: |
          python .github/scripts/generate_supplier_quotation_pdf.py /tmp/supplier-quotation.pdf
          python .github/scripts/generate_supplier_quotation_pdf.py /tmp/invalid-supplier-quotation.pdf 1748.42
          python .github/scripts/generate_supplier_quotation_pdf.py /tmp/borderless-supplier-quotation.pdf --borderless
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/supplier-invoice.pdf
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/retention-primary-invoice.pdf --invoice-number INV-RETENTION-PRIMARY
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/retention-other-invoice.pdf --invoice-number INV-RETENTION-OTHER
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/restart-uploaded-invoice.pdf --invoice-number INV-RESTART-UPLOADED
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/restart-processing-invoice.pdf --invoice-number INV-RESTART-PROCESSING

      - name: Verify automated processing scenarios
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__DocFlowDbContext: Host=127.0.0.1;Port=5432;Database=docflow;Username=postgres;Password=postgres
          Authentication__ApiKey__Clients__0__Name: e2e-primary
          Authentication__ApiKey__Clients__0__CustomerId: 11111111-1111-1111-1111-111111111111
          Authentication__ApiKey__Clients__0__ApiKey: docflow-e2e-primary-key
          Authentication__ApiKey__Clients__1__Name: e2e-other
          Authentication__ApiKey__Clients__1__CustomerId: 44444444-4444-4444-4444-444444444444
          Authentication__ApiKey__Clients__1__ApiKey: docflow-e2e-other-key
          Intake__Idempotency__CleanupIntervalSeconds: 1
          Intake__Idempotency__CleanupBatchSize: 1
          Notifications__Webhooks__PollIntervalSeconds: 1
          Notifications__Webhooks__RequestTimeoutSeconds: 3
          Notifications__Webhooks__MaxAttempts: 3
          Notifications__Webhooks__BaseRetryDelaySeconds: 1
          Notifications__Webhooks__MaxRetryDelaySeconds: 2
          Notifications__Webhooks__BatchSize: 10
          Notifications__Webhooks__DevelopmentAllowInsecureHttp: "true"
          Notifications__Webhooks__DevelopmentAllowPrivateNetworks: "true"
          Notifications__Webhooks__Tenants__0__CustomerId: 11111111-1111-1111-1111-111111111111
          Notifications__Webhooks__Tenants__0__Url: http://127.0.0.1:5099/webhook
          Notifications__Webhooks__Tenants__0__Secret: docflow-e2e-webhook-secret-0123456789
        run: |
          set -euo pipefail

          webhook_log=/tmp/docflow-webhook-events.jsonl
          DOCFLOW_WEBHOOK_SECRET='docflow-e2e-webhook-secret-0123456789' \
            python .github/scripts/webhook_receiver.py --port 5099 --output "$webhook_log" \
            > /tmp/docflow-webhook-receiver.log 2>&1 &
          webhook_pid=$!

          webhook_ready=false
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:5099/health; then
              webhook_ready=true
              break
            fi
            sleep 1
          done
          test "$webhook_ready" = "true"

          dotnet run \
            --project src/DocFlow.Api/DocFlow.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > /tmp/docflow-api.log 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            kill "$webhook_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/swagger/v1/swagger.json >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/docflow-api.log
            echo "API did not become ready."
            exit 1
          fi

          customer_id='11111111-1111-1111-1111-111111111111'
          other_customer_id='44444444-4444-4444-4444-444444444444'
          other_document_id='44444444-4444-4444-4444-444444444445'
          other_webhook_event_id='44444444-4444-4444-4444-444444444446'
          always_fail_webhook_event_id='33333333-3333-3333-3333-333333333336'
          always_fail_webhook_document_id='33333333-3333-3333-3333-333333333337'
          api_key='docflow-e2e-primary-key'
          other_api_key='docflow-e2e-other-key'
          auth_header=(-H "X-DocFlow-Api-Key: $api_key")

          echo "Scenario 0a: webhook worker selects configured tenants only and bounds permanent failures"
          docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"DocumentCompletionOutbox\" (\"Id\",\"DocumentId\",\"CustomerId\",\"Status\",\"DocumentType\",\"ProcessingAttempts\",\"OccurredAt\",\"DeliveryAttempts\",\"NextDeliveryAttemptAt\") VALUES ('$other_webhook_event_id','44444444-4444-4444-4444-444444444447','$other_customer_id','Processed','supplier_invoice',1,NOW(),0,NOW()),('$always_fail_webhook_event_id','$always_fail_webhook_document_id','$customer_id','Failed','force_webhook_failure',1,NOW(),0,NOW());"

          echo "Scenario 0: expired intake idempotency records and batch manifests are cleaned in bounded sweeps"
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"IntakeIdempotencyRecords\" (\"CustomerId\", \"Key\", \"RequestFingerprint\", \"Outcome\", \"OriginalFileName\", \"CreatedAt\", \"ExpiresAt\") VALUES ('$customer_id', 'cleanup-expired-1', repeat('a', 64), 'Rejected', 'cleanup-expired-1.pdf', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '1 hour'), ('$customer_id', 'cleanup-expired-2', repeat('b', 64), 'Rejected', 'cleanup-expired-2.pdf', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '1 hour'), ('$customer_id', 'cleanup-unexpired', repeat('c', 64), 'Rejected', 'cleanup-unexpired.pdf', NOW(), NOW() + INTERVAL '1 hour');"

          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"BatchIntakeIdempotencyRecords\" (\"CustomerId\", \"Key\", \"RequestFingerprint\", \"GenerationId\", \"CreatedAt\", \"ExpiresAt\") VALUES ('$customer_id', 'batch-cleanup-expired-1', repeat('d', 64), 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '1 hour'), ('$customer_id', 'batch-cleanup-expired-2', repeat('e', 64), 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '1 hour'), ('$customer_id', 'batch-cleanup-unexpired', repeat('f', 64), 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa3', NOW(), NOW() + INTERVAL '1 hour');"

          sleep 5

          cleanup_counts=$(docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -c \
            "SELECT COUNT(*) FILTER (WHERE \"Key\" LIKE 'cleanup-expired-%'), COUNT(*) FILTER (WHERE \"Key\" = 'cleanup-unexpired') FROM \"IntakeIdempotencyRecords\";")
          test "$cleanup_counts" = "0|1"

          batch_cleanup_counts=$(docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -c \
            "SELECT COUNT(*) FILTER (WHERE \"Key\" LIKE 'batch-cleanup-expired-%'), COUNT(*) FILTER (WHERE \"Key\" = 'batch-cleanup-unexpired') FROM \"BatchIntakeIdempotencyRecords\";")
          test "$batch_cleanup_counts" = "0|1"

          wait_for_terminal_status() {
            local document_id="$1"
            local status=""

            for _ in $(seq 1 30); do
              local document_json
              document_json=$(curl -fsS "${auth_header[@]}" \
                "http://127.0.0.1:5080/api/documents/$document_id")
              status=$(printf '%s' "$document_json" | jq -r '.status')

              case "$status" in
                Processed|NeedsReview|Failed)
                  printf '%s' "$status"
                  return 0
                  ;;
              esac

              sleep 1
            done

            printf '%s' "$status"
          }

          wait_for_webhook_state() {
            local event_id="$1"
            local expected="$2"
            for _ in $(seq 1 30); do
              local state
              state=$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
                psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
                "SELECT \"DeliveryAttempts\",(\"DeliveredAt\" IS NOT NULL)::int,(\"DeliveryAbandonedAt\" IS NOT NULL)::int FROM \"DocumentCompletionOutbox\" WHERE \"Id\"='$event_id';")
              if [ "$state" = "$expected" ]; then
                printf '%s' "$state"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          echo "Scenario 1: valid quotation is processed automatically"
          upload_json=$(curl -fsS \
            "${auth_header[@]}" \
            -X POST \
            -F 'File=@/tmp/supplier-quotation.pdf;type=application/pdf' \
            http://127.0.0.1:5080/api/documents)

          printf '%s' "$upload_json" | jq -e '.status == "Uploaded"' >/dev/null
          document_id=$(printf '%s' "$upload_json" | jq -r '.id')
          test -n "$document_id"
          test "$document_id" != "null"

          final_status=$(wait_for_terminal_status "$document_id")
          test "$final_status" = "Processed"

          result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$document_id/extraction-result")

          printf '%s' "$result_json" | jq -e '
            .validationStatus == "Valid"
            and .confidence == 1
            and .structuredData.engine == "deterministic_supplier_quotation_v1"
            and .structuredData.document_type == "supplier_quotation"
            and .structuredData.data.subtotal == "1457.00"
            and .structuredData.data.vat_rate == "20"
            and .structuredData.data.vat_amount == "291.40"
            and .structuredData.data.total == "1748.40"
            and (.structuredData.data.items | length) == 5
          ' >/dev/null

          result_id=$(printf '%s' "$result_json" | jq -r '.id')

          echo "Scenario 2: repeated enqueue is idempotent"
          for _ in 1 2; do
            process_code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "${auth_header[@]}" \
              -X POST "http://127.0.0.1:5080/api/documents/$document_id/process")
            test "$process_code" = "202"
          done

          sleep 2
          repeated_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$document_id/extraction-result")
          repeated_result_id=$(printf '%s' "$repeated_result_json" | jq -r '.id')
          test "$repeated_result_id" = "$result_id"
          repeated_document_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$document_id")
          test "$(printf '%s' "$repeated_document_json" | jq -r '.status')" = "Processed"

          echo "Scenario 3: invalid arithmetic routes to NeedsReview"
          invalid_upload_json=$(curl -fsS \
            "${auth_header[@]}" \
            -X POST \
            -F 'File=@/tmp/invalid-supplier-quotation.pdf;type=application/pdf' \
            http://127.0.0.1:5080/api/documents)

          invalid_document_id=$(printf '%s' "$invalid_upload_json" | jq -r '.id')
          invalid_status=$(wait_for_terminal_status "$invalid_document_id")
          echo "Invalid quotation final status: $invalid_status"

          invalid_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$invalid_document_id/extraction-result")
          echo "Invalid quotation persisted extraction result:"
          printf '%s' "$invalid_result_json" | jq .

          test "$invalid_status" = "NeedsReview"
          printf '%s' "$invalid_result_json" | jq -e '
            .validationStatus == "Invalid"
            and .structuredData.validation_status == "invalid"
            and .structuredData.data.total == "1748.42"
            and .structuredData.validation.checks.grand_total.status == "failed"
          ' >/dev/null

          echo "Scenario 4: Python technical failure routes to Failed"
          failed_document_id='22222222-2222-2222-2222-222222222222'
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"Documents\" (\"Id\", \"CustomerId\", \"OriginalFileName\", \"ContentType\", \"StorageKey\", \"Size\", \"Status\", \"CreatedAt\") VALUES ('$failed_document_id', '$customer_id', 'missing.pdf', 'application/pdf', 'missing/missing.pdf', 1, 'Uploaded', NOW());"

          failed_process_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${auth_header[@]}" \
            -X POST "http://127.0.0.1:5080/api/documents/$failed_document_id/process")
          test "$failed_process_code" = "202"

          failed_status=$(wait_for_terminal_status "$failed_document_id")
          if [ "$failed_status" != "Failed" ]; then
            cat /tmp/docflow-api.log
            echo "Expected Failed but got '$failed_status'."
            exit 1
          fi

          missing_result_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$failed_document_id/extraction-result")
          test "$missing_result_code" = "404"

          echo "Scenario 4b: terminal transitions are persisted to the completion outbox exactly once"
          processed_outbox=$(docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
            "SELECT COUNT(*), MIN(\"ProcessingAttempts\"), MIN(COALESCE(\"DocumentType\", '')) FROM \"DocumentCompletionOutbox\" WHERE \"DocumentId\" = '$document_id' AND \"Status\" = 'Processed';")
          test "$processed_outbox" = "1|1|supplier_quotation"

          needs_review_outbox=$(docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
            "SELECT COUNT(*), MIN(\"ProcessingAttempts\"), MIN(COALESCE(\"DocumentType\", '')) FROM \"DocumentCompletionOutbox\" WHERE \"DocumentId\" = '$invalid_document_id' AND \"Status\" = 'NeedsReview';")
          test "$needs_review_outbox" = "1|1|supplier_quotation"

          failed_outbox=$(docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
            "SELECT COUNT(*), MIN(\"ProcessingAttempts\"), MIN(COALESCE(\"DocumentType\", '')) FROM \"DocumentCompletionOutbox\" WHERE \"DocumentId\" = '$failed_document_id' AND \"Status\" = 'Failed';")
          test "$failed_outbox" = "1|3|"

          processed_event_id=$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h 127.0.0.1 -U postgres -d docflow -At -c "SELECT \"Id\" FROM \"DocumentCompletionOutbox\" WHERE \"DocumentId\"='$document_id' AND \"Status\"='Processed';")
          needs_review_event_id=$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h 127.0.0.1 -U postgres -d docflow -At -c "SELECT \"Id\" FROM \"DocumentCompletionOutbox\" WHERE \"DocumentId\"='$invalid_document_id' AND \"Status\"='NeedsReview';")
          failed_event_id=$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h 127.0.0.1 -U postgres -d docflow -At -c "SELECT \"Id\" FROM \"DocumentCompletionOutbox\" WHERE \"DocumentId\"='$failed_document_id' AND \"Status\"='Failed';")

          test "$(wait_for_webhook_state "$processed_event_id" '1|1|0')" = "1|1|0"
          test "$(wait_for_webhook_state "$needs_review_event_id" '2|1|0')" = "2|1|0"
          test "$(wait_for_webhook_state "$failed_event_id" '1|1|0')" = "1|1|0"
          test "$(wait_for_webhook_state "$always_fail_webhook_event_id" '3|0|1')" = "3|0|1"

          other_tenant_delivery=$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c "SELECT \"DeliveryAttempts\",(\"DeliveredAt\" IS NOT NULL)::int,(\"DeliveryAbandonedAt\" IS NOT NULL)::int FROM \"DocumentCompletionOutbox\" WHERE \"Id\"='$other_webhook_event_id';")
          test "$other_tenant_delivery" = "0|0|0"

          needs_review_error=$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 psql -h 127.0.0.1 -U postgres -d docflow -At -c "SELECT COALESCE(\"LastDeliveryError\",'') FROM \"DocumentCompletionOutbox\" WHERE \"Id\"='$needs_review_event_id';")
          test "$needs_review_error" = "Webhook endpoint returned HTTP 500."

          jq -s -e --arg customer_id "$customer_id" --arg other_customer_id "$other_customer_id" --arg processed_document_id "$document_id" --arg needs_review_document_id "$invalid_document_id" --arg failed_document_id "$failed_document_id" --arg always_fail_document_id "$always_fail_webhook_document_id" '
            all(.[]; .signatureValid == true and .headerMatches == true)
            and ([.[] | select(.payload.customerId == $other_customer_id)] | length) == 0
            and ([.[] | select(.payload.documentId == $processed_document_id)] | length) == 1
            and ([.[] | select(.payload.documentId == $needs_review_document_id)] | length) == 2
            and ([.[] | select(.payload.documentId == $needs_review_document_id) | .responseCode] == [500,204])
            and ([.[] | select(.payload.documentId == $failed_document_id)] | length) == 1
            and ([.[] | select(.payload.documentId == $always_fail_document_id)] | length) == 3
            and all(.[] | select(.payload.customerId == $customer_id); .payload.eventType == "document.completed")
          ' "$webhook_log" >/dev/null

          echo "Scenario 5: borderless digital quotation is processed automatically"
          borderless_upload_json=$(curl -fsS \
            "${auth_header[@]}" \
            -X POST \
            -F 'File=@/tmp/borderless-supplier-quotation.pdf;type=application/pdf' \
            http://127.0.0.1:5080/api/documents)

          borderless_document_id=$(printf '%s' "$borderless_upload_json" | jq -r '.id')
          borderless_status=$(wait_for_terminal_status "$borderless_document_id")
          if [ "$borderless_status" != "Processed" ]; then
            cat /tmp/docflow-api.log
            echo "Expected borderless quotation to be Processed but got '$borderless_status'."
            exit 1
          fi

          borderless_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$borderless_document_id/extraction-result")
          echo "Borderless quotation persisted extraction result:"
          printf '%s' "$borderless_result_json" | jq .

          printf '%s' "$borderless_result_json" | jq -e '
            .validationStatus == "Valid"
            and .confidence == 1
            and .structuredData.validation_status == "valid"
            and .structuredData.data.quotation_number == "QT-2026-183"
            and .structuredData.data.currency == "EUR"
            and .structuredData.data.subtotal == "1457.00"
            and .structuredData.data.vat_amount == "291.40"
            and .structuredData.data.total == "1748.40"
            and (.structuredData.data.items | length) == 5
          ' >/dev/null

          echo "Scenario 6: supplier invoice is detected and processed automatically"
          invoice_upload_json=$(curl -fsS \
            "${auth_header[@]}" \
            -X POST \
            -F 'File=@/tmp/supplier-invoice.pdf;type=application/pdf' \
            http://127.0.0.1:5080/api/documents)

          invoice_document_id=$(printf '%s' "$invoice_upload_json" | jq -r '.id')
          invoice_status=$(wait_for_terminal_status "$invoice_document_id")
          if [ "$invoice_status" != "Processed" ]; then
            cat /tmp/docflow-api.log
            echo "Expected supplier invoice to be Processed but got '$invoice_status'."
            exit 1
          fi

          invoice_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$invoice_document_id/extraction-result")
          echo "Supplier invoice persisted extraction result:"
          printf '%s' "$invoice_result_json" | jq .

          printf '%s' "$invoice_result_json" | jq -e '
            .validationStatus == "Valid"
            and .confidence == 1
            and .structuredData.engine == "deterministic_supplier_invoice_v2"
            and .structuredData.document_type == "supplier_invoice"
            and .structuredData.validation_status == "valid"
            and .structuredData.data.invoice_number == "INV-2026-091"
            and .structuredData.data.invoice_date == "2026-09-30"
            and .structuredData.data.due_date == "2026-10-30"
            and .structuredData.data.currency == "EUR"
            and .structuredData.data.purchase_order_number == "PO-78421"
            and .structuredData.data.subtotal == "1457.00"
            and .structuredData.data.vat_rate == "20"
            and .structuredData.data.vat_amount == "291.40"
            and .structuredData.data.total == "1748.40"
            and (.structuredData.data.items | length) == 5
          ' >/dev/null

          echo "Scenario 7: persisted extraction result exports to CSV and XLSX"
          python .github/scripts/verify_document_export.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --document-id "$invoice_document_id" \
            --document-without-result-id "$failed_document_id"

          echo "Scenario 7b: duplicate supplier invoice is flagged for human review"
          duplicate_upload_json=$(curl -fsS \
            "${auth_header[@]}" \
            -X POST \
            -F 'File=@/tmp/supplier-invoice.pdf;type=application/pdf' \
            http://127.0.0.1:5080/api/documents)

          duplicate_document_id=$(printf '%s' "$duplicate_upload_json" | jq -r '.id')
          duplicate_status=$(wait_for_terminal_status "$duplicate_document_id")
          test "$duplicate_status" = "NeedsReview"

          duplicate_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$duplicate_document_id/extraction-result")

          printf '%s' "$duplicate_result_json" | jq -e --arg original "$invoice_document_id" '
            .validationStatus == "Valid"
            and .structuredData.validation_status == "valid"
            and .structuredData.business_checks.duplicate_check.status == "suspected"
            and .structuredData.business_checks.duplicate_check.basis == "supplier_name+invoice_number"
            and .structuredData.business_checks.duplicate_check.duplicate_of_document_id == $original
          ' >/dev/null

          duplicate_business_csv=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$duplicate_document_id/export?format=invoice-csv")
          printf '%s' "$duplicate_business_csv" | grep -q '"suspected"'
          printf '%s' "$duplicate_business_csv" | grep -q "\"$invoice_document_id\""

          echo "Scenario 8: authenticated document inbox enforces tenant isolation"
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"Documents\" (\"Id\", \"CustomerId\", \"OriginalFileName\", \"ContentType\", \"StorageKey\", \"Size\", \"Status\", \"CreatedAt\") VALUES ('$other_document_id', '$other_customer_id', 'other-customer.pdf', 'application/pdf', 'other/other-customer.pdf', 1, 'Uploaded', NOW());"

          python .github/scripts/verify_document_inbox.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --other-api-key "$other_api_key" \
            --customer-id "$customer_id" \
            --other-customer-id "$other_customer_id" \
            --other-document-id "$other_document_id" \
            --invoice-document-id "$invoice_document_id" \
            --failed-document-id "$failed_document_id" \
            --needs-review-document-id "$invalid_document_id"

          echo "Scenario 8b: batch intake idempotency is tenant-scoped and concurrency-safe"
          python .github/scripts/verify_batch_idempotency.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --other-api-key "$other_api_key"

          echo "Scenario 9: NeedsReview document can be human-reviewed and exported"
          python .github/scripts/verify_document_review.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --review-document-id "$invalid_document_id" \
            --processed-document-id "$invoice_document_id"

          echo "Automation E2E core scenarios passed."

      - name: Verify restart recovery
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__DocFlowDbContext: Host=127.0.0.1;Port=5432;Database=docflow;Username=postgres;Password=postgres
          Authentication__ApiKey__Clients__0__Name: e2e-primary
          Authentication__ApiKey__Clients__0__CustomerId: 11111111-1111-1111-1111-111111111111
          Authentication__ApiKey__Clients__0__ApiKey: docflow-e2e-primary-key
          FileStorage__RootPath: /tmp/docflow-recovery-storage
          DOCFLOW_BASE_URL: http://127.0.0.1:5080
          DOCFLOW_API_KEY: docflow-e2e-primary-key
          DOCFLOW_CUSTOMER_ID: 11111111-1111-1111-1111-111111111111
        run: bash .github/scripts/verify_restart_recovery.sh
