            -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"AccountingPostingRecords\" (\"Id\",\"CustomerId\",\"DocumentId\",\"Provider\",\"TargetAccount\",\"IdempotencyKey\",\"PayloadJson\",\"Status\",\"Attempts\",\"CreatedAt\",\"UpdatedAt\",\"LastAttemptAt\",\"NextAttemptAt\") VALUES ('$stale_posting_id','$customer_id','$invoice_document_id','local-test','recovery-ledger','stale-posting-001','{\"schemaVersion\":\"accounting_bill_v1\",\"supplierName\":\"Recovery Supplier\",\"invoiceNumber\":\"INV-RECOVERY-001\",\"invoiceDate\":\"2026-09-30\",\"dueDate\":null,\"currency\":\"EUR\",\"customerReference\":null,\"purchaseOrderNumber\":null,\"lines\":[],\"discountAmount\":null,\"taxInclusive\":false,\"subtotal\":200.00,\"taxAmount\":40.00,\"total\":240.00,\"taxes\":[],\"paymentTerms\":null,\"notes\":null}'::jsonb,'Posting',1,NOW()-INTERVAL '10 seconds',NOW()-INTERVAL '10 seconds',NOW()-INTERVAL '10 seconds',NULL);"

          stale_posting_state=""
          for _ in $(seq 1 20); do
            stale_posting_state=$(docker run --rm --network host \
              -e PGPASSWORD=postgres postgres:16 \
              psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
              "SELECT \"Status\",\"Attempts\",COALESCE(\"ExternalReference\",'') FROM \"AccountingPostingRecords\" WHERE \"Id\"='$stale_posting_id';")
            if printf '%s' "$stale_posting_state" | grep -q '^Posted|2|local-posting:'; then
              break
            fi
            sleep 1
          done

          test "$(printf '%s' "$stale_posting_state" | cut -d'|' -f1)" = "Posted"
          test "$(printf '%s' "$stale_posting_state" | cut -d'|' -f2)" = "2"
          test "$(printf '%s' "$stale_posting_state" | cut -d'|' -f3)" = "local-posting:55555555555545558555555555555552"

          echo "Scenario 6b: purchase order is processed and reconciles with its invoice"
          po_upload_json=$(curl -fsS \
            "${auth_header[@]}" \
            -X POST \
            -F 'File=@/tmp/purchase-order.pdf;type=application/pdf' \
            http://127.0.0.1:5080/api/documents)

          po_document_id=$(printf '%s' "$po_upload_json" | jq -r '.id')
          po_status=$(wait_for_terminal_status "$po_document_id")
          test "$po_status" = "Processed"

          po_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$po_document_id/extraction-result")

          printf '%s' "$po_result_json" | jq -e '
            .validationStatus == "Valid"
            and .structuredData.document_type == "purchase_order"
            and .structuredData.data.purchase_order_number == "PO-78421"
            and .structuredData.data.currency == "EUR"
            and .structuredData.data.total == "1457.00"
            and (.structuredData.data.items | length) == 5
          ' >/dev/null

          reconciliation_json=$(curl -fsS \
            "${auth_header[@]}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"invoiceDocumentId\":\"$invoice_document_id\",\"purchaseOrderDocumentId\":\"$po_document_id\"}" \
            http://127.0.0.1:5080/api/reconciliation/invoice-po)

          printf '%s' "$reconciliation_json" | jq -e '
            .status == "Match"
            and .needsReviewChecks == 0
            and .skippedChecks == 0
            and (.documentChecks | length) == 2
            and all(.documentChecks[]; .status == "Passed")
            and (.invoiceItems | length) == 5
            and all(.invoiceItems[]; .status == "Passed" and .matchMethod == "sku_reference")
          ' >/dev/null

          echo "Scenario 6b.1: matching reconciliation persists as an Open review case"
          match_case_json=$(curl -fsS             "${auth_header[@]}"             -H 'Content-Type: application/json'             -X POST             -d "{\"invoiceDocumentId\":\"$invoice_document_id\",\"purchaseOrderDocumentId\":\"$po_document_id\"}"             http://127.0.0.1:5080/api/reconciliation/invoice-po/cases)

          match_case_id=$(printf '%s' "$match_case_json" | jq -r '.id')
          test -n "$match_case_id"
          test "$match_case_id" != "null"
          printf '%s' "$match_case_json" | jq -e '
            .reconciliationStatus == "Match"
            and .reviewStatus == "Open"
            and .createdByClient == "e2e-primary"
            and .report.status == "Match"
            and (.report.invoiceItems | length) == 5
          ' >/dev/null

          persisted_match_case_json=$(curl -fsS             "${auth_header[@]}"             "http://127.0.0.1:5080/api/reconciliation/cases/$match_case_id")

          test "$(printf '%s' "$persisted_match_case_json" | jq -r '.id')" = "$match_case_id"
          printf '%s' "$persisted_match_case_json" | jq -e '
            .reconciliationStatus == "Match"
            and .reviewStatus == "Open"
            and .report.status == "Match"
          ' >/dev/null

          other_tenant_case_code=$(curl -sS -o /dev/null -w '%{http_code}'             -H "X-DocFlow-Api-Key: $other_api_key"             "http://127.0.0.1:5080/api/reconciliation/cases/$match_case_id")
          test "$other_tenant_case_code" = "404"

          echo "Scenario 6b.2: clean Match case can be approved with immutable audit history"
          approved_case_json=$(curl -fsS \
            "${auth_header[@]}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"decision":"Approve","note":"Verified exact invoice/PO match."}' \
            "http://127.0.0.1:5080/api/reconciliation/cases/$match_case_id/decision")

          printf '%s' "$approved_case_json" | jq -e '
            .reviewStatus == "Approved"
            and (.auditHistory | length) == 2
            and .auditHistory[0].action == "Created"
            and .auditHistory[0].previousStatus == null
            and .auditHistory[0].newStatus == "Open"
            and .auditHistory[1].action == "Approve"
            and .auditHistory[1].previousStatus == "Open"
            and .auditHistory[1].newStatus == "Approved"
            and .auditHistory[1].note == "Verified exact invoice/PO match."
            and .auditHistory[1].performedByClient == "e2e-primary"
          ' >/dev/null

          terminal_case_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${auth_header[@]}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"decision":"Resolve","note":"Must not change a terminal case."}' \
            "http://127.0.0.1:5080/api/reconciliation/cases/$match_case_id/decision")
          test "$terminal_case_code" = "409"

          echo "Scenario 6c: valid but differently priced PO produces auditable NeedsReview"
          mismatch_po_upload_json=$(curl -fsS \
            "${auth_header[@]}" \
            -X POST \
            -F 'File=@/tmp/purchase-order-mismatch.pdf;type=application/pdf' \
            http://127.0.0.1:5080/api/documents)

          mismatch_po_document_id=$(printf '%s' "$mismatch_po_upload_json" | jq -r '.id')
          mismatch_po_status=$(wait_for_terminal_status "$mismatch_po_document_id")
          test "$mismatch_po_status" = "Processed"

          mismatch_reconciliation_json=$(curl -fsS \
            "${auth_header[@]}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"invoiceDocumentId\":\"$invoice_document_id\",\"purchaseOrderDocumentId\":\"$mismatch_po_document_id\"}" \
            http://127.0.0.1:5080/api/reconciliation/invoice-po)

          printf '%s' "$mismatch_reconciliation_json" | jq -e '
            .status == "NeedsReview"
            and .needsReviewChecks >= 2
            and .invoiceItems[0].status == "NeedsReview"
            and any(.invoiceItems[0].checks[]; .field == "unit_price" and .status == "NeedsReview" and .invoiceValue == "12.5" and .purchaseOrderValue == "13.5")
            and any(.invoiceItems[0].checks[]; .field == "line_total" and .status == "NeedsReview" and .invoiceValue == "250" and .purchaseOrderValue == "270")
            and all(.invoiceItems[1:][]; .status == "Passed")
          ' >/dev/null

          echo "Scenario 6c.1: mismatch persists as a NeedsReview case with evidence"
          mismatch_case_json=$(curl -fsS             "${auth_header[@]}"             -H 'Content-Type: application/json'             -X POST             -d "{\"invoiceDocumentId\":\"$invoice_document_id\",\"purchaseOrderDocumentId\":\"$mismatch_po_document_id\"}"             http://127.0.0.1:5080/api/reconciliation/invoice-po/cases)

          mismatch_case_id=$(printf '%s' "$mismatch_case_json" | jq -r '.id')
          test -n "$mismatch_case_id"
          test "$mismatch_case_id" != "null"
          printf '%s' "$mismatch_case_json" | jq -e '
            .reconciliationStatus == "NeedsReview"
            and .reviewStatus == "NeedsReview"
            and .createdByClient == "e2e-primary"
            and .report.status == "NeedsReview"
            and any(.report.invoiceItems[0].checks[]; .field == "unit_price" and .status == "NeedsReview" and .delta == "-1")
            and any(.report.invoiceItems[0].checks[]; .field == "line_total" and .status == "NeedsReview" and .delta == "-20")
          ' >/dev/null

          echo "Scenario 6c.2: mismatch case can be resolved with reviewer note"
          resolved_case_json=$(curl -fsS \
            "${auth_header[@]}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"decision":"Resolve","note":"Price difference accepted after supplier confirmation."}' \
            "http://127.0.0.1:5080/api/reconciliation/cases/$mismatch_case_id/decision")

          printf '%s' "$resolved_case_json" | jq -e '
            .reviewStatus == "Resolved"
            and (.auditHistory | length) == 2
            and .auditHistory[0].action == "Created"
            and .auditHistory[0].newStatus == "NeedsReview"
            and .auditHistory[1].action == "Resolve"
            and .auditHistory[1].previousStatus == "NeedsReview"
            and .auditHistory[1].newStatus == "Resolved"
            and .auditHistory[1].note == "Price difference accepted after supplier confirmation."
            and .auditHistory[1].performedByClient == "e2e-primary"
          ' >/dev/null

          echo "Scenario 6c.3: mismatch case can be rejected and Reject requires a note"
          reject_case_json=$(curl -fsS \
            "${auth_header[@]}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"invoiceDocumentId\":\"$invoice_document_id\",\"purchaseOrderDocumentId\":\"$mismatch_po_document_id\"}" \
            http://127.0.0.1:5080/api/reconciliation/invoice-po/cases)
          reject_case_id=$(printf '%s' "$reject_case_json" | jq -r '.id')

          reject_without_note_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${auth_header[@]}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"decision":"Reject"}' \
            "http://127.0.0.1:5080/api/reconciliation/cases/$reject_case_id/decision")
          test "$reject_without_note_code" = "400"

          rejected_case_json=$(curl -fsS \
            "${auth_header[@]}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"decision":"Reject","note":"Invoice price does not match approved purchase order."}' \
            "http://127.0.0.1:5080/api/reconciliation/cases/$reject_case_id/decision")

          printf '%s' "$rejected_case_json" | jq -e '
            .reviewStatus == "Rejected"
            and (.auditHistory | length) == 2
            and .auditHistory[1].action == "Reject"
            and .auditHistory[1].previousStatus == "NeedsReview"
            and .auditHistory[1].newStatus == "Rejected"
            and .auditHistory[1].note == "Invoice price does not match approved purchase order."
          ' >/dev/null

          echo "Scenario 6d: resolved reconciliation case exports business CSV and XLSX"
          python .github/scripts/verify_reconciliation_case_export.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --other-api-key "$other_api_key" \
            --case-id "$mismatch_case_id"

          echo "Scenario 7: persisted extraction result exports to CSV and XLSX"
          python .github/scripts/verify_document_export.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --document-id "$invoice_document_id" \
            --document-without-result-id "$failed_document_id" \
            --purchase-order-document-id "$po_document_id"

          echo "Scenario 7b: duplicate supplier invoice is flagged for human review"
          duplicate_upload_json=$(curl -fsS \
            "${auth_header[@]}" \
            -X POST \
            -F 'File=@/tmp/supplier-invoice.pdf;type=application/pdf' \
            http://127.0.0.1:5080/api/documents)

          duplicate_document_id=$(printf '%s' "$duplicate_upload_json" | jq -r '.id')
          duplicate_status=$(wait_for_terminal_status "$duplicate_document_id")
          test "$duplicate_status" = "NeedsReview"

          duplicate_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$duplicate_document_id/extraction-result")

          printf '%s' "$duplicate_result_json" | jq -e --arg original "$invoice_document_id" '
            .validationStatus == "Valid"
            and .structuredData.validation_status == "valid"
            and .structuredData.business_checks.duplicate_check.status == "suspected"
            and .structuredData.business_checks.duplicate_check.basis == "supplier_name+invoice_number"
            and .structuredData.business_checks.duplicate_check.duplicate_of_document_id == $original
          ' >/dev/null

          duplicate_business_csv=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$duplicate_document_id/export?format=invoice-csv")
          printf '%s' "$duplicate_business_csv" | grep -q '"suspected"'
          printf '%s' "$duplicate_business_csv" | grep -q "\"$invoice_document_id\""

          echo "Scenario 8: authenticated document inbox enforces tenant isolation"
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"Documents\" (\"Id\", \"CustomerId\", \"OriginalFileName\", \"ContentType\", \"StorageKey\", \"Size\", \"Status\", \"CreatedAt\") VALUES ('$other_document_id', '$other_customer_id', 'other-customer.pdf', 'application/pdf', 'other/other-customer.pdf', 1, 'Uploaded', NOW());"

          python .github/scripts/verify_document_inbox.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --other-api-key "$other_api_key" \
            --customer-id "$customer_id" \
            --other-customer-id "$other_customer_id" \
            --other-document-id "$other_document_id" \
            --other-mailbox-document-id "$other_mailbox_document_id" \
            --invoice-document-id "$invoice_document_id" \
            --failed-document-id "$failed_document_id" \
            --needs-review-document-id "$invalid_document_id"

          echo "Scenario 8b: batch intake idempotency is tenant-scoped and concurrency-safe"
          python .github/scripts/verify_batch_idempotency.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --other-api-key "$other_api_key"

          echo "Scenario 9: NeedsReview document can be human-reviewed and exported"
          python .github/scripts/verify_document_review.py \
            --base-url http://127.0.0.1:5080 \
            --api-key "$api_key" \
            --review-document-id "$invalid_document_id" \
            --processed-document-id "$invoice_document_id"

          echo "Automation E2E core scenarios passed."

      - name: Verify restart recovery
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__DocFlowDbContext: Host=127.0.0.1;Port=5432;Database=docflow;Username=postgres;Password=postgres
          Authentication__ApiKey__Clients__0__Name: e2e-primary
          Authentication__ApiKey__Clients__0__CustomerId: 11111111-1111-1111-1111-111111111111
          Authentication__ApiKey__Clients__0__ApiKey: docflow-e2e-primary-key
          FileStorage__RootPath: /tmp/docflow-recovery-storage
          DOCFLOW_BASE_URL: http://127.0.0.1:5080
          DOCFLOW_API_KEY: docflow-e2e-primary-key
          DOCFLOW_CUSTOMER_ID: 11111111-1111-1111-1111-111111111111
        run: bash .github/scripts/verify_restart_recovery.sh
