name: Automation E2E
# Final validation: 1.1.1.33 MailboxIntake

on:
  push:
    branches:
      - 'DocFlow/v_*'
    paths:
      - 'src/DocFlow.Api/**'
      - 'src/DocFlow.Application/**'
      - 'src/DocFlow.Domain/**'
      - 'src/DocFlow.Infrastructure/**'
      - 'src/DocFlow.Extraction.Worker/**'
      - '.github/scripts/generate_supplier_quotation_pdf.py'
      - '.github/scripts/generate_supplier_invoice_pdf.py'
      - '.github/scripts/generate_purchase_order_pdf.py'
      - '.github/scripts/generate_mailbox_message.py'
      - '.github/scripts/send_rfc822_smtp.py'
      - '.github/scripts/verify_batch_idempotency.py'
      - '.github/scripts/verify_document_export.py'
      - '.github/scripts/verify_document_inbox.py'
      - '.github/scripts/verify_document_review.py'
      - '.github/scripts/verify_restart_recovery.sh'
      - '.github/scripts/webhook_receiver.py'
      - '.github/workflows/automation-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: docflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=ap:pwd@example.com
        ports:
          - 3025:3025
          - 3143:3143

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/DocFlow.Extraction.Worker/pyproject.toml

      - name: Install Python worker
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pip install -e ".[dev]"

      - name: Build .NET
        run: |
          dotnet restore DocFlow.sln
          dotnet build DocFlow.sln --configuration Release --no-restore

      - name: Apply database migrations
        env:
          ConnectionStrings__DocFlowDbContext: Host=127.0.0.1;Port=5432;Database=docflow;Username=postgres;Password=postgres
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.21
          ~/.dotnet/tools/dotnet-ef database update \
            --project src/DocFlow.Infrastructure/DocFlow.Infrastructure.csproj \
            --startup-project src/DocFlow.Api/DocFlow.Api.csproj

      - name: Generate synthetic supplier documents
        run: |
          python .github/scripts/generate_supplier_quotation_pdf.py /tmp/supplier-quotation.pdf
          python .github/scripts/generate_supplier_quotation_pdf.py /tmp/invalid-supplier-quotation.pdf 1748.42
          python .github/scripts/generate_supplier_quotation_pdf.py /tmp/borderless-supplier-quotation.pdf --borderless
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/supplier-invoice.pdf
          python .github/scripts/generate_supplier_invoice_pdf.py \
            /tmp/mailbox-invoice.pdf \
            --invoice-number INV-MAILBOX-001
          python .github/scripts/generate_mailbox_message.py \
            --pdf /tmp/mailbox-invoice.pdf \
            --output /tmp/mailbox-message.eml
          python .github/scripts/generate_mailbox_message.py \
            --pdf /tmp/mailbox-invoice.pdf \
            --output /tmp/mailbox-message-conflict.eml \
            --subject "Changed payload with same Message-Id"

          python .github/scripts/generate_supplier_invoice_pdf.py \
            /tmp/imap-invoice-1.pdf \
            --invoice-number INV-IMAP-001
          python .github/scripts/generate_mailbox_message.py \
            --pdf /tmp/imap-invoice-1.pdf \
            --output /tmp/imap-message-1.eml \
            --message-id docflow-imap-e2e-1@example.test \
            --subject "IMAP invoice one" \
            --attachment-name imap-invoice-1.pdf
          python .github/scripts/generate_supplier_invoice_pdf.py \
            /tmp/imap-invoice-2.pdf \
            --invoice-number INV-IMAP-002
          python .github/scripts/generate_mailbox_message.py \
            --pdf /tmp/imap-invoice-2.pdf \
            --output /tmp/imap-message-2.eml \
            --message-id docflow-imap-e2e-2@example.test \
            --subject "IMAP invoice two" \
            --attachment-name imap-invoice-2.pdf
          python .github/scripts/generate_purchase_order_pdf.py /tmp/purchase-order.pdf
          python .github/scripts/generate_purchase_order_pdf.py /tmp/purchase-order-mismatch.pdf --mismatch-first-price
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/retention-primary-invoice.pdf --invoice-number INV-800001
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/retention-other-invoice.pdf --invoice-number INV-800002
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/restart-uploaded-invoice.pdf --invoice-number INV-900001
          python .github/scripts/generate_supplier_invoice_pdf.py /tmp/restart-processing-invoice.pdf --invoice-number INV-900002

      - name: Verify automated processing scenarios
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__DocFlowDbContext: Host=127.0.0.1;Port=5432;Database=docflow;Username=postgres;Password=postgres
          Authentication__ApiKey__Clients__0__Name: e2e-primary
          Authentication__ApiKey__Clients__0__CustomerId: 11111111-1111-1111-1111-111111111111
          Authentication__ApiKey__Clients__0__ApiKey: docflow-e2e-primary-key
          Authentication__ApiKey__Clients__1__Name: e2e-other
          Authentication__ApiKey__Clients__1__CustomerId: 44444444-4444-4444-4444-444444444444
          Authentication__ApiKey__Clients__1__ApiKey: docflow-e2e-other-key
          Intake__Idempotency__CleanupIntervalSeconds: 1
          Intake__Idempotency__CleanupBatchSize: 1
          AccountingPosting__Worker__PollIntervalSeconds: 1
          AccountingPosting__Worker__BatchSize: 10
          AccountingPosting__Worker__InProgressTimeoutSeconds: 1
          Mailbox__Imap__Enabled: "true"
          Mailbox__Imap__PollIntervalSeconds: 1
          Mailbox__Imap__BatchSize: 10
          Mailbox__Imap__Accounts__0__Name: e2e-local-imap
          Mailbox__Imap__Accounts__0__CustomerId: 11111111-1111-1111-1111-111111111111
          Mailbox__Imap__Accounts__0__Host: 127.0.0.1
          Mailbox__Imap__Accounts__0__Port: 3143
          Mailbox__Imap__Accounts__0__UseSsl: "false"
          Mailbox__Imap__Accounts__0__Username: ap
          Mailbox__Imap__Accounts__0__Password: pwd
          Mailbox__Imap__Accounts__0__Folder: INBOX
          Notifications__Webhooks__PollIntervalSeconds: 1
          Notifications__Webhooks__RequestTimeoutSeconds: 3
          Notifications__Webhooks__MaxAttempts: 3
          Notifications__Webhooks__BaseRetryDelaySeconds: 1
          Notifications__Webhooks__MaxRetryDelaySeconds: 2
          Notifications__Webhooks__BatchSize: 10
          Notifications__Webhooks__DevelopmentAllowInsecureHttp: "true"
          Notifications__Webhooks__DevelopmentAllowPrivateNetworks: "true"
          Notifications__Webhooks__Tenants__0__CustomerId: 11111111-1111-1111-1111-111111111111
          Notifications__Webhooks__Tenants__0__Url: http://127.0.0.1:5099/webhook
          Notifications__Webhooks__Tenants__0__Secret: docflow-e2e-webhook-secret-0123456789
        run: |
          set -euo pipefail

          webhook_log=/tmp/docflow-webhook-events.jsonl
          DOCFLOW_WEBHOOK_SECRET='docflow-e2e-webhook-secret-0123456789' \
            python .github/scripts/webhook_receiver.py --port 5099 --output "$webhook_log" \
            > /tmp/docflow-webhook-receiver.log 2>&1 &
          webhook_pid=$!

          webhook_ready=false
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:5099/health; then
              webhook_ready=true
              break
            fi
            sleep 1
          done
          test "$webhook_ready" = "true"

          greenmail_ready=false
          for _ in $(seq 1 30); do
            if python -c 'import imaplib, smtplib; smtp=smtplib.SMTP("127.0.0.1", 3025, timeout=2); assert smtp.noop()[0] == 250; smtp.quit(); imap=imaplib.IMAP4("127.0.0.1", 3143, timeout=2); imap.login("ap", "pwd"); assert imap.select("INBOX")[0] == "OK"; imap.logout()'; then
              greenmail_ready=true
              break
            fi
            sleep 1
          done
          test "$greenmail_ready" = "true"

          python .github/scripts/send_rfc822_smtp.py \
            --port 3025 \
            --sender billing@example.com \
            --recipient ap@example.com \
            --message /tmp/imap-message-1.eml

          dotnet run \
            --project src/DocFlow.Api/DocFlow.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > /tmp/docflow-api.log 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            kill "$webhook_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/swagger/v1/swagger.json >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/docflow-api.log
            echo "API did not become ready."
            exit 1
          fi

          customer_id='11111111-1111-1111-1111-111111111111'
          other_customer_id='44444444-4444-4444-4444-444444444444'
          other_document_id='44444444-4444-4444-4444-444444444445'
          other_webhook_event_id='44444444-4444-4444-4444-444444444446'
          always_fail_webhook_event_id='33333333-3333-3333-3333-333333333336'
          always_fail_webhook_document_id='33333333-3333-3333-3333-333333333337'
          api_key='docflow-e2e-primary-key'
          other_api_key='docflow-e2e-other-key'
          auth_header=(-H "X-DocFlow-Api-Key: $api_key")

          echo "Scenario 0a: webhook worker selects configured tenants only and bounds permanent failures"
          docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"DocumentCompletionOutbox\" (\"Id\",\"DocumentId\",\"CustomerId\",\"Status\",\"DocumentType\",\"ProcessingAttempts\",\"OccurredAt\",\"DeliveryAttempts\",\"NextDeliveryAttemptAt\") VALUES ('$other_webhook_event_id','44444444-4444-4444-4444-444444444447','$other_customer_id','Processed','supplier_invoice',1,NOW(),0,NOW()),('$always_fail_webhook_event_id','$always_fail_webhook_document_id','$customer_id','Failed','force_webhook_failure',1,NOW(),0,NOW());"

          echo "Scenario 0: expired intake idempotency records and batch manifests are cleaned in bounded sweeps"
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"IntakeIdempotencyRecords\" (\"CustomerId\", \"Key\", \"RequestFingerprint\", \"Outcome\", \"OriginalFileName\", \"CreatedAt\", \"ExpiresAt\") VALUES ('$customer_id', 'cleanup-expired-1', repeat('a', 64), 'Rejected', 'cleanup-expired-1.pdf', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '1 hour'), ('$customer_id', 'cleanup-expired-2', repeat('b', 64), 'Rejected', 'cleanup-expired-2.pdf', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '1 hour'), ('$customer_id', 'cleanup-unexpired', repeat('c', 64), 'Rejected', 'cleanup-unexpired.pdf', NOW(), NOW() + INTERVAL '1 hour');"

          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -v ON_ERROR_STOP=1 -c \
            "INSERT INTO \"BatchIntakeIdempotencyRecords\" (\"CustomerId\", \"Key\", \"RequestFingerprint\", \"GenerationId\", \"CreatedAt\", \"ExpiresAt\") VALUES ('$customer_id', 'batch-cleanup-expired-1', repeat('d', 64), 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '1 hour'), ('$customer_id', 'batch-cleanup-expired-2', repeat('e', 64), 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2', NOW() - INTERVAL '2 hours', NOW() - INTERVAL '1 hour'), ('$customer_id', 'batch-cleanup-unexpired', repeat('f', 64), 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa3', NOW(), NOW() + INTERVAL '1 hour');"

          sleep 5

          cleanup_counts=$(docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -c \
            "SELECT COUNT(*) FILTER (WHERE \"Key\" LIKE 'cleanup-expired-%'), COUNT(*) FILTER (WHERE \"Key\" = 'cleanup-unexpired') FROM \"IntakeIdempotencyRecords\";")
          test "$cleanup_counts" = "0|1"

          batch_cleanup_counts=$(docker run --rm --network host \
            -e PGPASSWORD=postgres \
            postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -c \
            "SELECT COUNT(*) FILTER (WHERE \"Key\" LIKE 'batch-cleanup-expired-%'), COUNT(*) FILTER (WHERE \"Key\" = 'batch-cleanup-unexpired') FROM \"BatchIntakeIdempotencyRecords\";")
          test "$batch_cleanup_counts" = "0|1"

          wait_for_terminal_status() {
            local document_id="$1"
            local status=""

            for _ in $(seq 1 30); do
              local document_json
              document_json=$(curl -fsS "${auth_header[@]}" \
                "http://127.0.0.1:5080/api/documents/$document_id")
              status=$(printf '%s' "$document_json" | jq -r '.status')

              case "$status" in
                Processed|NeedsReview|Failed)
                  printf '%s' "$status"
                  return 0
                  ;;
              esac

              sleep 1
            done

            printf '%s' "$status"
          }

          wait_for_webhook_state() {
            local event_id="$1"
            local expected="$2"
            for _ in $(seq 1 30); do
              local state
              state=$(docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
                psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
                "SELECT \"DeliveryAttempts\",(\"DeliveredAt\" IS NOT NULL)::int,(\"DeliveryAbandonedAt\" IS NOT NULL)::int FROM \"DocumentCompletionOutbox\" WHERE \"Id\"='$event_id';")
              if [ "$state" = "$expected" ]; then
                printf '%s' "$state"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          echo "Scenario 0c: local IMAP polling persists UID checkpoint and survives API restart"
          imap_document_id=""
          for _ in $(seq 1 30); do
            imap_document_id=$(docker run --rm --network host \
              -e PGPASSWORD=postgres postgres:16 \
              psql -h 127.0.0.1 -U postgres -d docflow -At -c \
              "SELECT COALESCE(a.\"DocumentId\"::text,'') FROM \"MailboxMessages\" m JOIN \"MailboxAttachments\" a ON a.\"MailboxMessageId\"=m.\"Id\" WHERE m.\"CustomerId\"='$customer_id' AND m.\"MessageIdentity\"='message-id:docflow-imap-e2e-1@example.test' LIMIT 1;")
            if [ -n "$imap_document_id" ]; then
              break
            fi
            sleep 1
          done
          test -n "$imap_document_id"

          imap_status=$(wait_for_terminal_status "$imap_document_id")
          test "$imap_status" = "Processed"
          imap_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$imap_document_id/extraction-result")
          printf '%s' "$imap_result_json" | jq -e '
            .validationStatus == "Valid"
            and .structuredData.document_type == "supplier_invoice"
            and .structuredData.data.invoice_number == "INV-IMAP-001"
          ' >/dev/null

          first_checkpoint=$(docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
            "SELECT \"UidValidity\",\"LastUid\" FROM \"ImapMailboxCheckpoints\" WHERE \"CustomerId\"='$customer_id' AND \"MailboxKey\"='e2e-local-imap' AND \"FolderName\"='INBOX';")
          test -n "$first_checkpoint"
          first_uid_validity=$(printf '%s' "$first_checkpoint" | cut -d'|' -f1)
          first_last_uid=$(printf '%s' "$first_checkpoint" | cut -d'|' -f2)
          test "$first_uid_validity" -gt 0
          test "$first_last_uid" -gt 0

          kill "$api_pid"
          wait "$api_pid" 2>/dev/null || true

          python .github/scripts/send_rfc822_smtp.py \
            --port 3025 \
            --sender billing@example.com \
            --recipient ap@example.com \
            --message /tmp/imap-message-2.eml

          dotnet run \
            --project src/DocFlow.Api/DocFlow.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            >> /tmp/docflow-api.log 2>&1 &
          api_pid=$!

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/swagger/v1/swagger.json >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"

          imap_document_id_2=""
          for _ in $(seq 1 30); do
            imap_document_id_2=$(docker run --rm --network host \
              -e PGPASSWORD=postgres postgres:16 \
              psql -h 127.0.0.1 -U postgres -d docflow -At -c \
              "SELECT COALESCE(a.\"DocumentId\"::text,'') FROM \"MailboxMessages\" m JOIN \"MailboxAttachments\" a ON a.\"MailboxMessageId\"=m.\"Id\" WHERE m.\"CustomerId\"='$customer_id' AND m.\"MessageIdentity\"='message-id:docflow-imap-e2e-2@example.test' LIMIT 1;")
            if [ -n "$imap_document_id_2" ]; then
              break
            fi
            sleep 1
          done
          test -n "$imap_document_id_2"
          test "$imap_document_id_2" != "$imap_document_id"

          imap_status_2=$(wait_for_terminal_status "$imap_document_id_2")
          test "$imap_status_2" = "Processed"
          imap_result_json_2=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$imap_document_id_2/extraction-result")
          printf '%s' "$imap_result_json_2" | jq -e '
            .validationStatus == "Valid"
            and .structuredData.document_type == "supplier_invoice"
            and .structuredData.data.invoice_number == "INV-IMAP-002"
          ' >/dev/null

          second_checkpoint=$(docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
            "SELECT \"UidValidity\",\"LastUid\" FROM \"ImapMailboxCheckpoints\" WHERE \"CustomerId\"='$customer_id' AND \"MailboxKey\"='e2e-local-imap' AND \"FolderName\"='INBOX';")
          second_uid_validity=$(printf '%s' "$second_checkpoint" | cut -d'|' -f1)
          second_last_uid=$(printf '%s' "$second_checkpoint" | cut -d'|' -f2)
          test "$second_uid_validity" = "$first_uid_validity"
          test "$second_last_uid" -gt "$first_last_uid"

          imap_first_document_count=$(docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -c \
            "SELECT COUNT(*) FROM \"Documents\" WHERE \"CustomerId\"='$customer_id' AND \"OriginalFileName\"='imap-invoice-1.pdf';")
          test "$imap_first_document_count" = "1"

          echo "Scenario 0b: RFC822 mailbox PDF enters normal document processing idempotently"
          mailbox_code=$(curl -sS -o /tmp/mailbox-first.json -w '%{http_code}' \
            "${auth_header[@]}" \
            -H 'Content-Type: message/rfc822' \
            --data-binary @/tmp/mailbox-message.eml \
            http://127.0.0.1:5080/api/mailbox/messages/rfc822)
          test "$mailbox_code" = "201"

          mailbox_json=$(cat /tmp/mailbox-first.json)
          printf '%s' "$mailbox_json" | jq -e '
            .outcome == "Accepted"
            and .messageIdentity == "message-id:docflow-mailbox-e2e@example.test"
            and .internetMessageId == "docflow-mailbox-e2e@example.test"
            and .sender == "billing@example.com"
            and .subject == "Supplier invoice from mailbox"
            and (.pdfAttachments | length) == 1
            and .pdfAttachments[0].ordinal == 0
            and .pdfAttachments[0].fileName == "mailbox-invoice.pdf"
            and .pdfAttachments[0].contentType == "application/pdf"
            and .pdfAttachments[0].size > 0
            and (.pdfAttachments[0].sha256 | length) == 64
            and (.pdfAttachments[0].documentId | length) == 36
          ' >/dev/null

          mailbox_id=$(printf '%s' "$mailbox_json" | jq -r '.mailboxMessageId')
          mailbox_document_id=$(printf '%s' "$mailbox_json" | jq -r '.pdfAttachments[0].documentId')
          test -n "$mailbox_id"
          test "$mailbox_id" != "null"
          test -n "$mailbox_document_id"
          test "$mailbox_document_id" != "null"

          mailbox_db_state=$(docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -F '|' -c \
            "SELECT (SELECT COUNT(*) FROM \"MailboxMessages\" WHERE \"Id\"='$mailbox_id' AND \"CustomerId\"='$customer_id'), (SELECT COUNT(*) FROM \"MailboxAttachments\" WHERE \"MailboxMessageId\"='$mailbox_id' AND \"DocumentId\"='$mailbox_document_id'), (SELECT COUNT(*) FROM \"Documents\" WHERE \"Id\"='$mailbox_document_id' AND \"CustomerId\"='$customer_id' AND \"OriginalFileName\"='mailbox-invoice.pdf');")
          test "$mailbox_db_state" = "1|1|1"

          mailbox_document_status=$(wait_for_terminal_status "$mailbox_document_id")
          test "$mailbox_document_status" = "Processed"

          mailbox_result_json=$(curl -fsS \
            "${auth_header[@]}" \
            "http://127.0.0.1:5080/api/documents/$mailbox_document_id/extraction-result")
          printf '%s' "$mailbox_result_json" | jq -e '
            .validationStatus == "Valid"
            and .structuredData.document_type == "supplier_invoice"
            and .structuredData.validation_status == "valid"
            and .structuredData.data.invoice_number == "INV-MAILBOX-001"
          ' >/dev/null

          replay_code=$(curl -sS -D /tmp/mailbox-replay.headers -o /tmp/mailbox-replay.json -w '%{http_code}' \
            "${auth_header[@]}" \
            -H 'Content-Type: message/rfc822' \
            --data-binary @/tmp/mailbox-message.eml \
            http://127.0.0.1:5080/api/mailbox/messages/rfc822)
          test "$replay_code" = "200"
          replay_json=$(cat /tmp/mailbox-replay.json)
          test "$(printf '%s' "$replay_json" | jq -r '.outcome')" = "Replay"
          test "$(printf '%s' "$replay_json" | jq -r '.mailboxMessageId')" = "$mailbox_id"
          test "$(printf '%s' "$replay_json" | jq -r '.pdfAttachments[0].documentId')" = "$mailbox_document_id"
          grep -qi '^Idempotency-Replayed: true' /tmp/mailbox-replay.headers

          primary_mailbox_document_count=$(docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d docflow -At -c \
            "SELECT COUNT(*) FROM \"Documents\" WHERE \"CustomerId\"='$customer_id' AND \"OriginalFileName\"='mailbox-invoice.pdf';")
          test "$primary_mailbox_document_count" = "1"

          echo "Scenario 0b.1: replay repairs a lost mailbox-to-document link without duplicating Document"
