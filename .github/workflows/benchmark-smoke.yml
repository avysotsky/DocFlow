name: Benchmark Smoke

on:
  push:
    branches:
      - 'DocFlow/v_*'
    paths:
      - 'src/DocFlow.Extraction.Worker/**'
      - 'benchmarks/**'
      - '.github/scripts/generate_supplier_quotation_pdf.py'
      - '.github/scripts/generate_supplier_invoice_pdf.py'
      - '.github/workflows/benchmark-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/DocFlow.Extraction.Worker/pyproject.toml

      - name: Install Python worker
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pip install -e ".[dev]"

      - name: Generate benchmark corpus
        run: |
          mkdir -p /tmp/docflow-benchmark/corpus
          python .github/scripts/generate_supplier_quotation_pdf.py \
            /tmp/docflow-benchmark/corpus/quotation.pdf
          python .github/scripts/generate_supplier_invoice_pdf.py \
            /tmp/docflow-benchmark/corpus/invoice.pdf
          cp /tmp/docflow-benchmark/corpus/quotation.pdf \
            /tmp/docflow-benchmark/corpus/quotation-duplicate.pdf

      - name: Inventory once to prepare pinned manifest hashes
        working-directory: src/DocFlow.Extraction.Worker
        run: |
          python corpus_inventory.py \
            --corpus /tmp/docflow-benchmark/corpus \
            --output /tmp/docflow-benchmark/manifest-source-inventory.json

          jq -e '
            .documents_total == 3
            and .unique_contents == 2
            and .duplicates == 1
            and .errors == 0
            and ([.documents[].source_kind] | all(. == "digital"))
          ' /tmp/docflow-benchmark/manifest-source-inventory.json >/dev/null

      - name: Create benchmark manifest from inventory
        run: |
          quotation_sha=$(jq -r '.documents[] | select(.file == "quotation.pdf") | .sha256' \
            /tmp/docflow-benchmark/manifest-source-inventory.json)
          invoice_sha=$(jq -r '.documents[] | select(.file == "invoice.pdf") | .sha256' \
            /tmp/docflow-benchmark/manifest-source-inventory.json)

          jq -n \
            --arg quotation_sha "$quotation_sha" \
            --arg invoice_sha "$invoice_sha" \
            '{
              version: 1,
              documents: [
                {
                  id: "synthetic-quotation",
                  file: "corpus/quotation.pdf",
                  sha256: $quotation_sha,
                  metadata: {
                    supplier: "supplier-a",
                    source_kind: "digital",
                    layout_class: "borderless",
                    language: "en",
                    tags: ["quotation", "vat"]
                  },
                  document_type: "auto",
                  expected: {
                    document_type: "supplier_quotation",
                    validation_status: "valid",
                    fields: {
                      "data.quotation_number": "QT-2026-183",
                      "data.currency": "EUR",
                      "data.subtotal": "1457.00",
                      "data.vat_amount": "291.40",
                      "data.total": "1748.40",
                      "data.items.0.sku": "AX-100",
                      confidence: 1.0
                    }
                  }
                },
                {
                  id: "synthetic-invoice",
                  file: "corpus/invoice.pdf",
                  sha256: $invoice_sha,
                  metadata: {
                    supplier: "supplier-b",
                    source_kind: "digital",
                    layout_class: "table",
                    language: "en",
                    tags: ["invoice", "purchase-order"]
                  },
                  document_type: "auto",
                  expected: {
                    document_type: "supplier_invoice",
                    validation_status: "valid",
                    fields: {
                      "data.invoice_number": "INV-2026-091",
                      "data.currency": "EUR",
                      "data.subtotal": "1457.00",
                      "data.vat_amount": "291.40",
                      "data.total": "1748.40",
                      "data.items.0.sku": "AX-100",
                      confidence: 1.0
                    }
                  }
                }
              ]
            }' > /tmp/docflow-benchmark/manifest.json

      - name: Run complete real corpus workflow
        working-directory: src/DocFlow.Extraction.Worker
        run: |
          python real_corpus.py \
            --corpus /tmp/docflow-benchmark/corpus \
            --manifest /tmp/docflow-benchmark/manifest.json \
            --results /tmp/docflow-benchmark/results \
            --disable-ocr

      - name: Verify inventory, audit and benchmark outputs
        run: |
          jq -e '
            .documents_total == 3
            and .unique_contents == 2
            and .duplicates == 1
            and .errors == 0
            and ([.documents[] | select(.duplicate_of != null)] | length) == 1
          ' /tmp/docflow-benchmark/results/corpus-inventory.json >/dev/null

          jq -e '
            .errors == 0
            and .warnings == 1
            and .inventory_documents == 3
            and .inventory_unique_contents == 2
            and .manifest_documents == 2
            and .represented_unique_contents == 2
            and ([.issues[] | select(.code == "duplicate_content_present")] | length) == 1
          ' /tmp/docflow-benchmark/results/corpus-audit.json >/dev/null

          jq -e '
            .metrics.documents_total == 2
            and .metrics.documents_passed == 2
            and .metrics.documents_failed == 0
            and .metrics.document_pass_rate == 1
            and .metrics.document_type_accuracy == 1
            and .metrics.validation_status_accuracy == 1
            and .metrics.field_accuracy == 1
            and (.metrics.failure_reason_counts | length) == 0
            and .breakdowns.by_supplier["supplier-a"].documents_passed == 1
            and .breakdowns.by_supplier["supplier-b"].documents_passed == 1
            and .breakdowns.by_source_kind.digital.documents_total == 2
            and .breakdowns.by_layout_class.borderless.documents_total == 1
            and .breakdowns.by_layout_class.table.documents_total == 1
            and .breakdowns.by_language.en.documents_total == 2
            and ([.documents[].file_sha256] | all(length == 64))
          ' /tmp/docflow-benchmark/results/benchmark-report.json >/dev/null

          echo "End-to-end real corpus workflow smoke passed."
