name: Purchase Order Independent Benchmark

on:
  push:
    branches:
      - 'DocFlow/v_1.1.1.31_PurchaseOrderProcessing'
    paths:
      - '.github/scripts/build_purchase_order_independent_benchmark_corpus.py'
      - '.github/workflows/purchase-order-independent-benchmark.yml'
      - 'src/DocFlow.Extraction.Worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/DocFlow.Extraction.Worker/pyproject.toml

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tessdata_dir=$(dirname "$(dpkg -L tesseract-ocr-eng | grep '/eng.traineddata$' | head -n 1)")
          test -n "$tessdata_dir"
          echo "TESSDATA_PREFIX=$tessdata_dir" >> "$GITHUB_ENV"

      - name: Install Python worker
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pip install -e ".[dev]"

      - name: Run Python regression tests
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pytest -q

      - name: Build frozen independent PO corpus
        run: |
          python .github/scripts/build_purchase_order_independent_benchmark_corpus.py             --output /tmp/docflow-po-independent-benchmark             --min-documents 5
          cat /tmp/docflow-po-independent-benchmark/build-summary.json
          cat /tmp/docflow-po-independent-benchmark/sources-report.json

      - name: Run independent PO benchmark
        id: benchmark
        working-directory: src/DocFlow.Extraction.Worker
        shell: bash
        run: |
          set +e
          python real_corpus.py             --corpus /tmp/docflow-po-independent-benchmark/corpus             --manifest /tmp/docflow-po-independent-benchmark/manifest.json             --results /tmp/docflow-po-independent-benchmark/results
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build benchmark summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/docflow-po-independent-benchmark")
          report_path = root / "results" / "benchmark-report.json"
          if not report_path.exists():
              raise SystemExit("benchmark-report.json was not produced")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          totals = {
              "checked": 0,
              "matched": 0,
              "header_checked": 0,
              "header_matched": 0,
              "item_checked": 0,
              "item_matched": 0,
          }
          documents = []

          for document in report.get("documents", []):
              row = {
                  "id": document["id"],
                  "passed": document["passed"],
                  "actual_document_type": document.get("actual_document_type"),
                  "actual_validation_status": document.get("actual_validation_status"),
                  "failure_reasons": document.get("failure_reasons", []),
                  "checked": 0,
                  "matched": 0,
                  "header_checked": 0,
                  "header_matched": 0,
                  "item_checked": 0,
                  "item_matched": 0,
              }
              for comparison in document.get("field_comparisons", []):
                  matched = bool(comparison.get("matched"))
                  path = comparison["path"]
                  row["checked"] += 1
                  row["matched"] += int(matched)
                  if path.startswith("data.items."):
                      row["item_checked"] += 1
                      row["item_matched"] += int(matched)
                  else:
                      row["header_checked"] += 1
                      row["header_matched"] += int(matched)

              for key in totals:
                  totals[key] += row[key]
              documents.append(row)

          def ratio(matched, checked):
              return None if checked == 0 else round(matched / checked, 4)

          summary = {
              "documents_total": len(documents),
              "documents_passed": sum(row["passed"] for row in documents),
              **totals,
              "overall_accuracy": ratio(totals["matched"], totals["checked"]),
              "header_accuracy": ratio(
                  totals["header_matched"], totals["header_checked"]
              ),
              "line_item_accuracy": ratio(
                  totals["item_matched"], totals["item_checked"]
              ),
              "documents": documents,
          }
          (root / "po-independent-summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-order-independent-benchmark
          if-no-files-found: error
          path: |
            /tmp/docflow-po-independent-benchmark/build-summary.json
            /tmp/docflow-po-independent-benchmark/sources-report.json
            /tmp/docflow-po-independent-benchmark/manifest.json
            /tmp/docflow-po-independent-benchmark/po-independent-summary.json
            /tmp/docflow-po-independent-benchmark/results/*.json

      - name: Enforce benchmark result
        if: always()
        shell: bash
        run: |
          test -f /tmp/docflow-po-independent-benchmark/results/benchmark-report.json
          test "${{ steps.benchmark.outputs.exit_code }}" = "0"
