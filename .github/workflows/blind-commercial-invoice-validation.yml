name: Blind Commercial Invoice Validation

on:
  push:
    branches:
      - 'DocFlow/blind-commercial-validation'
    paths:
      - '.github/scripts/build_blind_commercial_invoice_corpus.py'
      - '.github/workflows/blind-commercial-invoice-validation.yml'
      - 'src/DocFlow.Extraction.Worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-commercial-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/DocFlow.Extraction.Worker/pyproject.toml

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tessdata_dir=$(dirname "$(dpkg -L tesseract-ocr-eng | grep '/eng.traineddata$' | head -n 1)")
          test -n "$tessdata_dir"
          echo "TESSDATA_PREFIX=$tessdata_dir" >> "$GITHUB_ENV"

      - name: Install Python worker
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pip install -e ".[dev]"

      - name: Build blind corpus
        run: |
          python .github/scripts/build_blind_commercial_invoice_corpus.py \
            --output /tmp/docflow-blind-commercial \
            --min-documents 8

          cat /tmp/docflow-blind-commercial/build-summary.json
          cat /tmp/docflow-blind-commercial/sources-report.json

      - name: Run benchmark
        id: benchmark
        working-directory: src/DocFlow.Extraction.Worker
        shell: bash
        run: |
          set +e
          python real_corpus.py \
            --corpus /tmp/docflow-blind-commercial/corpus \
            --manifest /tmp/docflow-blind-commercial/manifest.json \
            --results /tmp/docflow-blind-commercial/results
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build commercial accuracy summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/docflow-blind-commercial")
          report_path = root / "results" / "benchmark-report.json"
          if not report_path.exists():
              raise SystemExit("benchmark-report.json was not produced")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          item_prefix = "data.items."
          header_paths = {
              "data.invoice_number",
              "data.invoice_date",
              "data.due_date",
              "data.currency",
              "data.purchase_order_number",
              "data.subtotal",
              "data.vat_rate",
              "data.vat_amount",
              "data.total",
          }

          totals = {
              "all_checked": 0,
              "all_matched": 0,
              "header_checked": 0,
              "header_matched": 0,
              "line_item_checked": 0,
              "line_item_matched": 0,
          }
          per_document = []

          for document in report.get("documents", []):
              counts = {
                  "all_checked": 0,
                  "all_matched": 0,
                  "header_checked": 0,
                  "header_matched": 0,
                  "line_item_checked": 0,
                  "line_item_matched": 0,
              }
              for comparison in document.get("field_comparisons", []):
                  path = comparison["path"]
                  matched = bool(comparison.get("matched"))
                  counts["all_checked"] += 1
                  counts["all_matched"] += int(matched)

                  if path.startswith(item_prefix):
                      counts["line_item_checked"] += 1
                      counts["line_item_matched"] += int(matched)
                  elif path in header_paths:
                      counts["header_checked"] += 1
                      counts["header_matched"] += int(matched)

              for key in totals:
                  totals[key] += counts[key]

              def accuracy(matched, checked):
                  return None if checked == 0 else round(matched / checked, 4)

              per_document.append(
                  {
                      "id": document["id"],
                      "passed": document["passed"],
                      "actual_document_type": document.get("actual_document_type"),
                      "actual_validation_status": document.get("actual_validation_status"),
                      "ocr_applied": document.get("ocr_applied"),
                      "failure_reasons": document.get("failure_reasons", []),
                      **counts,
                      "header_accuracy": accuracy(
                          counts["header_matched"], counts["header_checked"]
                      ),
                      "line_item_accuracy": accuracy(
                          counts["line_item_matched"], counts["line_item_checked"]
                      ),
                      "overall_field_accuracy": accuracy(
                          counts["all_matched"], counts["all_checked"]
                      ),
                  }
              )

          def accuracy(matched, checked):
              return None if checked == 0 else round(matched / checked, 4)

          macro_header = [
              row["header_accuracy"] for row in per_document
              if row["header_accuracy"] is not None
          ]
          macro_items = [
              row["line_item_accuracy"] for row in per_document
              if row["line_item_accuracy"] is not None
          ]

          summary = {
              "documents_total": len(per_document),
              "documents_fully_passed": sum(row["passed"] for row in per_document),
              **totals,
              "overall_field_accuracy": accuracy(
                  totals["all_matched"], totals["all_checked"]
              ),
              "header_accuracy_micro": accuracy(
                  totals["header_matched"], totals["header_checked"]
              ),
              "line_item_accuracy_micro": accuracy(
                  totals["line_item_matched"], totals["line_item_checked"]
              ),
              "header_accuracy_macro": (
                  None if not macro_header
                  else round(sum(macro_header) / len(macro_header), 4)
              ),
              "line_item_accuracy_macro": (
                  None if not macro_items
                  else round(sum(macro_items) / len(macro_items), 4)
              ),
              "per_document": per_document,
          }

          (root / "commercial-summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo "## Blind Commercial Invoice Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Benchmark engine exit code: ${{ steps.benchmark.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '### Corpus build' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/docflow-blind-commercial/build-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '### Commercial accuracy' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/docflow-blind-commercial/commercial-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-commercial-invoice-validation
          if-no-files-found: error
          path: |
            /tmp/docflow-blind-commercial/build-summary.json
            /tmp/docflow-blind-commercial/sources-report.json
            /tmp/docflow-blind-commercial/manifest.json
            /tmp/docflow-blind-commercial/commercial-summary.json
            /tmp/docflow-blind-commercial/results/*.json

      - name: Ensure validation completed
        if: always()
        shell: bash
        run: |
          test -f /tmp/docflow-blind-commercial/results/benchmark-report.json
          test -f /tmp/docflow-blind-commercial/commercial-summary.json
