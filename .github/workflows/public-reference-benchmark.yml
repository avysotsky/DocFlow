name: Public Reference Benchmark

on:
  push:
    branches:
      - 'DocFlow/v_1.1.1.5_RealCorpus'
    paths:
      - '.github/scripts/build_public_reference_corpus.py'
      - '.github/workflows/public-reference-benchmark.yml'
      - 'src/DocFlow.Extraction.Worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-reference-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/DocFlow.Extraction.Worker/pyproject.toml

      - name: Install Python worker
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pip install -e ".[dev]"

      - name: Build corpus from original public supplier PDFs
        run: |
          python .github/scripts/build_public_reference_corpus.py \
            --output /tmp/docflow-public-reference \
            --min-documents 3

          cat /tmp/docflow-public-reference/build-summary.json
          cat /tmp/docflow-public-reference/sources-report.json

      - name: Audit and benchmark public reference corpus
        id: benchmark
        working-directory: src/DocFlow.Extraction.Worker
        shell: bash
        run: |
          set +e
          python real_corpus.py \
            --corpus /tmp/docflow-public-reference/corpus \
            --manifest /tmp/docflow-public-reference/manifest.json \
            --results /tmp/docflow-public-reference/results \
            --disable-ocr
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish benchmark summary
        shell: bash
        run: |
          echo "## Public Reference Benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Source build:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/docflow-public-reference/build-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "real_corpus.py exit code: ${{ steps.benchmark.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/docflow-public-reference/results/corpus-audit.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Audit:" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '{errors, warnings, inventory_documents, inventory_unique_contents, manifest_documents, represented_unique_contents}' \
              /tmp/docflow-public-reference/results/corpus-audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f /tmp/docflow-public-reference/results/benchmark-report.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Metrics:" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '.metrics' /tmp/docflow-public-reference/results/benchmark-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: public-reference-benchmark
          if-no-files-found: error
          path: |
            /tmp/docflow-public-reference/build-summary.json
            /tmp/docflow-public-reference/sources-report.json
            /tmp/docflow-public-reference/manifest.json
            /tmp/docflow-public-reference/results/*.json
