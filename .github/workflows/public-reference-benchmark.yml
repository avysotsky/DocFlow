name: Public Reference Benchmark
# Validation batch: sparse OCR invoice date

on:
  push:
    branches:
      - 'DocFlow/v_1.1.1.30_MarketAlignment'
      - 'DocFlow/v_1.1.1.5_RealCorpus'
      - 'DocFlow/v_1.1.1.6_HardCases'
      - 'DocFlow/v_1.1.1.6_HardCases_2'
      - 'DocFlow/v_1.1.1.6_HardCases_3'
      - 'DocFlow/v_1.1.1.7_DegradedOCR'
    paths:
      - '.github/scripts/build_public_reference_corpus.py'
      - '.github/scripts/add_breadth_public_reference.py'
      - '.github/scripts/add_degraded_public_reference.py'
      - '.github/scripts/add_multipage_public_reference.py'
      - '.github/scripts/add_french_multivat_public_reference.py'
      - '.github/scripts/correct_public_reference_selection.py'
      - '.github/scripts/annotate_public_reference_validation.py'
      - '.github/scripts/dump_public_reference_text.py'
      - '.github/scripts/dump_public_reference_processed_text.py'
      - '.github/workflows/public-reference-benchmark.yml'
      - 'src/DocFlow.Extraction.Worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-reference-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/DocFlow.Extraction.Worker/pyproject.toml

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          tessdata_dir=$(dirname "$(dpkg -L tesseract-ocr-eng | grep '/eng.traineddata$' | head -n 1)")
          test -n "$tessdata_dir"
          echo "TESSDATA_PREFIX=$tessdata_dir" >> "$GITHUB_ENV"
          tesseract --version

      - name: Install Python worker
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pip install -e ".[dev]"

      - name: Run Python worker regression tests
        working-directory: src/DocFlow.Extraction.Worker
        run: python -m pytest -q

      - name: Build corpus from original public supplier PDFs and images
        shell: bash
        run: |
          python .github/scripts/build_public_reference_corpus.py \
            --output /tmp/docflow-public-reference \
            --min-documents 8

          python .github/scripts/add_breadth_public_reference.py \
            --root /tmp/docflow-public-reference

          python .github/scripts/add_degraded_public_reference.py \
            --root /tmp/docflow-public-reference

          python .github/scripts/add_multipage_public_reference.py \
            --root /tmp/docflow-public-reference

          python .github/scripts/add_french_multivat_public_reference.py \
            --root /tmp/docflow-public-reference

          python .github/scripts/correct_public_reference_selection.py \
            --root /tmp/docflow-public-reference

          python .github/scripts/annotate_public_reference_validation.py \
            --manifest /tmp/docflow-public-reference/manifest.json

          python .github/scripts/dump_public_reference_text.py \
            --corpus /tmp/docflow-public-reference/corpus \
            --output /tmp/docflow-public-reference/page-texts.json

          python .github/scripts/dump_public_reference_processed_text.py \
            --corpus /tmp/docflow-public-reference/corpus \
            --output /tmp/docflow-public-reference/processed-texts.json

          echo "=== build summary ==="
          cat /tmp/docflow-public-reference/build-summary.json
          echo "=== per-source report ==="
          cat /tmp/docflow-public-reference/sources-report.json

          count=$(jq -r '.manifest_documents' /tmp/docflow-public-reference/build-summary.json)
          if [ "$count" -lt 17 ]; then
            echo "DegradedOCR requires at least 17 admitted public-reference documents."
            exit 2
          fi

          for required in \
            phoenix-petroleum-invoice-472557 \
            cargo-international-invoice-g59771 \
            casterton-foodworks-invoice-02706 \
            facturalex-french-multivat-f20260023 \
            ct-gardens-invoice-inv-0055 \
            ct-gardens-invoice-inv-0065 \
            ct-gardens-invoice-inv-0220 \
            teec-invoice-inv-5383 \
            biffa-wirral-invoice-wir00286
          do
            if ! jq -e --arg id "$required" '.documents[] | select(.id == $id)' \
              /tmp/docflow-public-reference/manifest.json > /dev/null; then
              echo "Required hard case $required is missing from the benchmark manifest."
              exit 2
            fi
          done

      - name: Audit and benchmark public reference corpus
        id: benchmark
        working-directory: src/DocFlow.Extraction.Worker
        shell: bash
        run: |
          set +e
          python real_corpus.py \
            --corpus /tmp/docflow-public-reference/corpus \
            --manifest /tmp/docflow-public-reference/manifest.json \
            --results /tmp/docflow-public-reference/results
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          echo "## Public Reference Benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Source build:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/docflow-public-reference/build-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "real_corpus.py exit code: ${{ steps.benchmark.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/docflow-public-reference/results/corpus-audit.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Audit:" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '{errors, warnings, inventory_documents, inventory_unique_contents, manifest_documents, represented_unique_contents}' \
              /tmp/docflow-public-reference/results/corpus-audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f /tmp/docflow-public-reference/results/benchmark-report.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Metrics:" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '.metrics' /tmp/docflow-public-reference/results/benchmark-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-reference-benchmark
          if-no-files-found: error
          path: |
            /tmp/docflow-public-reference/build-summary.json
            /tmp/docflow-public-reference/sources-report.json
            /tmp/docflow-public-reference/page-texts.json
            /tmp/docflow-public-reference/processed-texts.json
            /tmp/docflow-public-reference/manifest.json
            /tmp/docflow-public-reference/results/*.json

      - name: Enforce benchmark result
        if: always()
        shell: bash
        run: |
          code='${{ steps.benchmark.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "real_corpus.py did not report an exit code."
            exit 1
          fi

          report=/tmp/docflow-public-reference/results/benchmark-report.json
          if [ ! -f "$report" ]; then
            echo "Benchmark report was not produced."
            exit 1
          fi

          total=$(jq -r '.metrics.documents_total' "$report")
          checked=$(jq -r '.metrics.validation_status_checked' "$report")
          if [ "$checked" -ne "$total" ]; then
            echo "Validation-status ground truth is incomplete: checked $checked of $total documents."
            exit 1
          fi

          if [ "$code" -ne 0 ]; then
            echo "Public reference benchmark failed with exit code $code."
            exit "$code"
          fi
